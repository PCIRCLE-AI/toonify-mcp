name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default GITHUB_TOKEN: this workflow only checks out code and
# runs tests, so read-only access to repo contents is all it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [18.x, 20.x, 22.x]
        # One Windows leg: issue #19 shipped a Windows-only test failure
        # because nothing ran the suite there. A single current-LTS leg keeps
        # cross-platform coverage without tripling CI cost.
        include:
          - os: windows-latest
            node-version: 22.x

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
